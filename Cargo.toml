[package]
name = "brave-cli-control"
version = "0.2.0"
edition = "2024"
description = "Safe local Brave browser control and semantic page inspection over CDP"
license = "MIT"

[[bin]]
name = "brave-cli"
path = "src-rust/main.rs"

[dependencies]
anyhow = "1"
async-tungstenite = { version = "0.32.1", features = ["tokio-runtime"] }
clap = { version = "4", features = ["derive"] }
chromiumoxide = "0.9"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"
