[package]
name = "brave-cli-control"
version = "0.2.0"
edition = "2024"
description = "Safe local Brave browser control and semantic page inspection over CDP"
license = "MIT"

[[bin]]
name = "brave-cli"
path = "src-rust/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chromiumoxide = "0.9"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"
